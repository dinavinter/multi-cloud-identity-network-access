name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  workflow_dispatch:
    inputs:
      force_root:
        description: 'Force deployment to root (overwrites main site)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm i

      - name: Determine Base Path and Target Folder
        id: config
        run: |
          FORCE_ROOT="${{ inputs.force_root }}"
          
          if [[ "${{ github.ref_name }}" == "main" ]] || [[ "$FORCE_ROOT" == "true" ]]; then
            # If CNAME is used, main should be served from root path /
            echo "Deploying to ROOT (Base Path: /)"
            echo "base_path=/" >> $GITHUB_OUTPUT
            echo "target_folder=." >> $GITHUB_OUTPUT
            echo "clean=true" >> $GITHUB_OUTPUT
          else
            # Feature branches are subdirectories
            echo "Deploying to SUBDIRECTORY (Base Path: /${{ github.ref_name }}/)"
            echo "base_path=/${{ github.ref_name }}/" >> $GITHUB_OUTPUT
            echo "target_folder=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "clean=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: |
          npm run build
          touch dist/.nojekyll
        env:
          BASE_PATH: ${{ steps.config.outputs.base_path }}

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dynamically determine the git host domain from github.server_url
          SERVER_URL="${{ github.server_url }}"
          DOMAIN="${SERVER_URL#*://}"
          
          git remote set-url origin "https://git:${GITHUB_TOKEN}@${DOMAIN}/${GITHUB_REPOSITORY}.git"
                    
           
          npx gh-pages -d dist -u "github-actions-bot <support+actions@github.com>" \
            --branch gh-pages \
            --dest "${{ steps.config.outputs.target_folder }}" 
